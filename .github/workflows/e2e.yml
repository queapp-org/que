name: E2E tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    name: Should E2E tests run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # Depth 2 fetches the merge commit and both of its parents.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - id: decide
        run: node scripts/mac-jobs.mjs

  e2e:
    name: E2E tests
    needs: decide
    # Only an explicit false skips. Without !cancelled(), a failed decide job would skip this
    # one, and a skipped job counts as passing a required check.
    if: ${{ !cancelled() && needs.decide.outputs.run != 'false' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: npm run build

      - run: node scripts/smoke.mjs

      - name: Playwright
        run: npx playwright test --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/playwright.json

      - name: Summarize results
        if: always()
        run: |
          if [ -f test-results/playwright.json ]; then
            jq -r '.stats | "### E2E tests\n\(.expected) passed, \(.unexpected) failed, \(.flaky) flaky, \(.skipped) skipped"' test-results/playwright.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### E2E tests: no results file" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
