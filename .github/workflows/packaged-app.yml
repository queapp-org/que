name: Packaged app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaged-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    name: Should Packaged app run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # Depth 2 fetches the merge commit and both of its parents.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - id: decide
        run: node scripts/mac-jobs.mjs

  packaged-app:
    name: Packaged app
    needs: decide
    # Only an explicit false skips. Without !cancelled(), a failed decide job would skip this
    # one, and a skipped job counts as passing a required check.
    if: ${{ !cancelled() && needs.decide.outputs.run != 'false' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Builds que.app with electron-builder and drives it with Playwright.
      - run: npm run smoke:packaged
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
