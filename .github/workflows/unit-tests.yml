name: Unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    name: Should Unit tests run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # Depth 2 fetches the merge commit and both of its parents.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - id: decide
        run: node scripts/mac-jobs.mjs

  unit-tests:
    name: Unit tests
    needs: decide
    # Only an explicit false skips. Without !cancelled(), a failed decide job would skip this
    # one, and a skipped job counts as passing a required check.
    if: ${{ !cancelled() && needs.decide.outputs.run != 'false' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Vitest
        run: npx vitest run --coverage --reporter=default --reporter=json --outputFile=test-results/vitest.json

      - name: Upload coverage report
        if: always()
        id: coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Summarize results
        if: always()
        # The artifact link reaches the shell as an environment variable, never interpolated into the script.
        env:
          COVERAGE_URL: ${{ steps.coverage.outputs.artifact-url }}
        run: |
          if [ -f test-results/vitest.json ]; then
            jq -r '"### Unit tests\n\(.numPassedTests) passed, \(.numFailedTests) failed, \(.numPendingTests) skipped (of \(.numTotalTests))"' test-results/vitest.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Unit tests: no results file" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo
              echo "#### Coverage"
              echo
              echo "| Metric | Covered |"
              echo "| --- | ---: |"
              jq -r '.total | "| Lines | \(.lines.pct)% |", "| Statements | \(.statements.pct)% |", "| Branches | \(.branches.pct)% |", "| Functions | \(.functions.pct)% |"' coverage/coverage-summary.json
              if [ -n "$COVERAGE_URL" ]; then
                echo
                echo "[Full coverage report]($COVERAGE_URL)"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            { echo; echo "No coverage summary was written."; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
